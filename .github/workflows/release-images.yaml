name: release immutable images

on:
  workflow_dispatch:
    inputs:
      registry_host:
        description: Artifact Registry host, for example asia-southeast1-docker.pkg.dev
        required: true
      repository:
        description: Artifact Registry repository path, for example project/portal
        required: true
      version:
        description: Reviewed release identifier
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bff
            context: .
            file: Dockerfile
          - name: rm
            context: ui-rm
            file: ui-rm/Dockerfile
          - name: ops
            context: ui-ops
            file: ui-ops/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        id: auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_IMAGE_BUILDER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ inputs.registry_host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ inputs.registry_host }}/${{ inputs.repository }}/hrz9-${{ matrix.name }}:quarantine-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: ${{ inputs.registry_host }}/${{ inputs.repository }}/hrz9-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign exact digest
        env:
          IMAGE: ${{ inputs.registry_host }}/${{ inputs.repository }}/hrz9-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Promote verified digest to reviewed release tag
        env:
          IMAGE: ${{ inputs.registry_host }}/${{ inputs.repository }}/hrz9-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${IMAGE}@${DIGEST}"
      - name: Record deployment input
        env:
          IMAGE: ${{ inputs.registry_host }}/${{ inputs.repository }}/hrz9-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" | tee "hrz9-${{ matrix.name }}.digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hrz9-${{ matrix.name }}-digest
          path: hrz9-${{ matrix.name }}.digest
          retention-days: 90
