name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The default profile is 'local' everywhere (the SDK-free offline stack). Production sets
# PORTAL_PROFILE=gcp explicitly on Cloud Run.
env:
  PORTAL_PROFILE: local

jobs:
  check:
    name: lint · typecheck · test · eval (offline, no GCP SDKs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # Install the framework-light core + dev tools (the public commons resolve from git+https with
      # no credentials). The [gcp] extra is deliberately NOT installed: the gate must pass with no
      # Google Cloud SDKs, proving the local profile and the lazy-import discipline.
      - name: Install locked SDK-free stack
        run: |
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff (lint + format)
        run: |
          ruff check src tests eval scripts/deployment_config.py scripts/live_profile_check.py scripts/verify_gcp_control_plane.py scripts/demo_selftest.py scripts/demo_browser_selftest.py scripts/portability_demo.py scripts/rename_fork.py ui-rm/static_server.py ui-ops/static_server.py
          ruff format --check src tests eval scripts/deployment_config.py scripts/live_profile_check.py scripts/verify_gcp_control_plane.py scripts/demo_selftest.py scripts/demo_browser_selftest.py scripts/portability_demo.py scripts/rename_fork.py ui-rm/static_server.py ui-ops/static_server.py

      - name: Mypy (strict)
        run: mypy src

      - name: Pytest (must pass with no Google Cloud SDKs installed)
        run: pytest -m 'not integration' -q

      - name: Eval gate (offline smoke, exit non-zero on fail)
        run: python eval/run_eval.py

      - name: Demo anti-rot and portability evidence
        run: |
          python scripts/demo_selftest.py
          python scripts/portability_demo.py

      - name: Install headless demo toolchain
        run: |
          pip install -r requirements-demo.lock
          python -m playwright install --with-deps chromium

      - name: Build shells and run headed-state assertions in Chromium
        run: |
          (cd ui-rm && npm ci && PORTAL_STATIC_EXPORT=1 npm run build)
          (cd ui-ops && npm ci && npm run build)
          python scripts/demo_browser_selftest.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build immutable-image inputs
        run: |
          docker build -t journey-portal:ci .
          docker build -t hrz-journey-rm:ci ui-rm
          docker build -t hrz-journey-ops:ci ui-ops

  ui-rm:
    name: RM shell typecheck (React / Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "20"
      - name: npm ci + typecheck + build + audit
        working-directory: ui-rm
        run: |
          npm ci
          npm run lint
          npm run build
          node ../scripts/npm_audit_gate.mjs

  ui-ops:
    name: Ops shell typecheck (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Angular 22 refuses to run below Node ^22.22.3 || ^24.15.0 || >=26 and exits 3,
      # so this shell needs a newer Node than the React shell.
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: "24"
      - name: npm ci + typecheck + build + audit
        working-directory: ui-ops
        run: |
          npm ci
          npm run lint
          npm run build
          node ../scripts/npm_audit_gate.mjs

  supply-chain:
    name: locked Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      - run: |
          pip-audit -r requirements-build.lock --disable-pip --no-deps
          pip-audit -r requirements-dev.lock --disable-pip --no-deps
          pip-audit -r requirements-gcp.lock --disable-pip --no-deps
          pip-audit -r requirements-demo.lock --disable-pip --no-deps

  terraform:
    name: terraform format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.15.6"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
