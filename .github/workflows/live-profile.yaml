name: live profile integration

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# This is deliberately separate from the default offline CI gate. Configure the named
# live-integration environment only after the deployment and its evidence owners exist.
jobs:
  hosted-journeys:
    environment: live-integration
    runs-on: ubuntu-latest
    env:
      LIVE_GCP_PROJECT_ID: ${{ vars.LIVE_GCP_PROJECT_ID }}
      LIVE_RM_URL: ${{ vars.LIVE_RM_URL }}
      LIVE_OPS_URL: ${{ vars.LIVE_OPS_URL }}
      LIVE_IAP_OAUTH_CLIENT_ID: ${{ vars.LIVE_IAP_OAUTH_CLIENT_ID }}
      LIVE_EXPECTED_REGION: ${{ vars.LIVE_EXPECTED_REGION }}
      LIVE_NAME_PREFIX: ${{ vars.LIVE_NAME_PREFIX }}
      LIVE_EXPECTED_IMAGES_JSON: ${{ vars.LIVE_EXPECTED_IMAGES_JSON }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Fail closed on absent or placeholder environment inputs
        shell: bash
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_LIVE_INTEGRATION_SERVICE_ACCOUNT: ${{ secrets.GCP_LIVE_INTEGRATION_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in LIVE_GCP_PROJECT_ID LIVE_RM_URL LIVE_OPS_URL LIVE_IAP_OAUTH_CLIENT_ID LIVE_EXPECTED_REGION LIVE_NAME_PREFIX LIVE_EXPECTED_IMAGES_JSON GCP_WORKLOAD_IDENTITY_PROVIDER GCP_LIVE_INTEGRATION_SERVICE_ACCOUNT; do
            value="${!name:-}"
            if [[ -z "${value}" || "${value,,}" == *replace* || "${value,,}" == *placeholder* || "${value,,}" == *.example.test* ]]; then
              echo "::error::${name} is absent or still a placeholder"
              exit 1
            fi
          done

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: control-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_LIVE_INTEGRATION_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.LIVE_GCP_PROJECT_ID }}

      - name: Verify exact GCP control-plane resources
        run: |
          python scripts/verify_gcp_control_plane.py \
            --project-id "${LIVE_GCP_PROJECT_ID}" \
            --region "${LIVE_EXPECTED_REGION}" \
            --iap-client-id "${LIVE_IAP_OAUTH_CLIENT_ID}" \
            --name-prefix "${LIVE_NAME_PREFIX}" \
            --expected-images-json "${LIVE_EXPECTED_IMAGES_JSON}"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: iap-auth
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_LIVE_INTEGRATION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.LIVE_IAP_OAUTH_CLIENT_ID }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Exercise both IAP-protected journeys
        env:
          LIVE_IAP_ID_TOKEN: ${{ steps.iap-auth.outputs.id_token }}
        run: |
          python scripts/live_profile_check.py \
            --rm-url "${LIVE_RM_URL}" \
            --ops-url "${LIVE_OPS_URL}" \
            --expected-region "${LIVE_EXPECTED_REGION}"
