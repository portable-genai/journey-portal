# Scored by: eval/run_eval.py::config_case_ok against the golden case's own `valid` flag, which a
# reviewer set by reading the configuration. Never against the builder's own verdict: a metric
# that compared the builder with itself would be a tautology with a threshold.
#
# This repository is NOT agentic. Every metric here is a deterministic security or composition
# invariant, which is the right reading of an eval for a trust boundary: what a portal owes is
# not "a good answer" but "the same refusal, every time".
#
# 1.0, raised from 0.99, and the number is arithmetic rather than ambition. This is a per-case
# accept/reject check over six configurations, so a 0.99 bar passed only at six out of six: five
# of six is 0.833. It was a 1.0 wearing a 0.99 label. It is also what the property means: a
# catalogue builder that accepts a malformed journey five times in six is not a builder.
metric: journey_integrity
description: >
  The journey-catalogue builder accepts exactly the configurations a reviewer marked valid and
  refuses exactly the ones marked invalid.
threshold: 1.0
direction: maximize
scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"
denominator:
  # `all-or-nothing`: the bar is 1.0, so it already asks for no headroom and the denominator rule
  # (agent_eval_kit.denominators) has nothing to say about it. What DOES matter is that the kind
  # selects at least one case: `_fraction` scores an empty selection 0.0, never 1.0, and
  # `_warn_unmeasured` names the metric on stderr so the zero explains itself.
  kind: all-or-nothing
  over: golden cases of kind 'config'
falsified_by: >
  tests/unit/test_not_falsely_green.py feeds each shipped predicate a case carrying exactly the
  defect it exists to catch, and eval/run_eval.py refuses a dataset whose kind no metric scores.
