# Journey Portal configuration: journeys are CONFIG, not code.
#
# A "journey" is a persona-scoped set of embedded apps composed into one UI. An "app" is a built
# catalog vertical mounted same-origin under the portal. Most artifacts use /apps/<id>; Doc1 keeps
# /apps/doc1 as a compatibility entry while its fixed, portable artifact is served at /agent.
# Each app declares its Next.js UI and FastAPI backend. The portal reverse-proxies:
#   <canonical_mount>/*       -> ui_upstream  (canonical path forwarded unchanged)
#   <canonical_mount>/api/*   -> api_upstream (the public prefix is stripped)
#
# Upstreams use ${ENV:-default} interpolation so the same config drives the local launcher and a
# cloud deploy (where the defaults are overridden with the internal service URLs).

journeys:
  rm:
    label: "RM Journeys"
    blurb: "Relationship-Manager Workbench: Onboarding & Advisory"
    apps: [doc1, doc5, doc3]
  ops:
    label: "Ops Journeys"
    blurb: "Operations Workbench: Underwriting, Trade Docs, Compliance & Review Queue"
    apps: [doc2, doc4, rsk1, hrz7]
  mkt:
    label: "Marketing Journeys"
    blurb: "Campaign Manager Workbench: Research, Plan, Create, Clear, Optimise & Personalise"
    apps: [mkt1, mkt2, mkt3, mkt6, mkt4, mkt5, hrz7]
  gov:
    label: "AI Governance Journeys"
    blurb: "Model-Risk Workbench: Architecture Conformance, Promotion Gate & Sign-off"
    apps: [rsk3, hrz4, hrz7]
  svc:
    label: "Service Journeys"
    blurb: "Complaints Handler Workbench: Intake, Outcome Assessment & Review"
    apps: [doc6, rsk1, hrz7]

apps:
  doc1:
    label: "CDD + Source of Wealth"
    canonical_mount_path: "/agent"
    ui_upstream: "${PORTAL_DOC1_UI:-http://127.0.0.1:3101}"
    api_upstream: "${PORTAL_DOC1_API:-http://127.0.0.1:8090}"
  doc2:
    label: "Credit Memo / Underwriting"
    ui_upstream: "${PORTAL_DOC2_UI:-http://127.0.0.1:3102}"
    api_upstream: "${PORTAL_DOC2_API:-http://127.0.0.1:8093}"
  doc5:
    label: "Loan / Mortgage Document Intelligence"
    ui_upstream: "${PORTAL_DOC5_UI:-http://127.0.0.1:3106}"
