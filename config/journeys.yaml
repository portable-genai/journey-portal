    ui_upstream: "${PORTAL_DOC3_UI:-http://127.0.0.1:3103}"
    api_upstream: "${PORTAL_DOC3_API:-http://127.0.0.1:8091}"
  doc4:
    label: "Trade-Finance Checker (UCP600)"
    ui_upstream: "${PORTAL_DOC4_UI:-http://127.0.0.1:3104}"
