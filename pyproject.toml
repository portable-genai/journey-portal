[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "journey-portal"
version = "0.0.1"
description = "Hrz9 Journey Portal Shell: a persona-journey host that composes the built P1 app UIs into one UI per user (an RM Journey and an Ops Journey) via same-origin reverse-proxy embedding. A FastAPI BFF owns the proxy, the journey config, local persona-to-header identity injection and cloud IAP passthrough; two thin UI shells (React and Angular) prove host-framework agnosticism. Built ports-and-adapters on the catalog commons (GCP, asia-southeast1)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ashish Awasthi" }]
keywords = ["portal", "micro-frontend", "reverse-proxy", "embedding", "sso", "iap", "bff", "gcp", "cloud-run"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
]

# The catalog commons, pinned by tag (no build-time coupling: a deliberate per-repo bump). The
# managed cloud SDKs live in the [gcp] extra so the local/onprem gate installs none of them.
dependencies = [
  "pii-kit @ git+https://github.com/portable-genai/pii-kit@v0.0.1",
  "hex-service-kit[fastapi] @ git+https://github.com/portable-genai/hex-service-kit@v0.0.1",
  "agent-eval-kit @ git+https://github.com/portable-genai/agent-eval-kit@v0.0.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Managed cloud SDKs (lazy-imported by the gcp adapters). NOT installed by the local gate.
# google-auth backs IAP identity verification for the standalone / same-origin secure shapes.
gcp = [
  "google-auth>=2.0",
  "google-cloud-logging>=3.0",
]
# The SDK-free dev/test/CI toolchain. Ruff is pinned EXACTLY so formatting never drifts.
dev = [
  "pytest>=8.2",
  "ruff==0.16.3",
  "mypy>=1.10",
  "types-PyYAML",
]
demo = [
  "playwright==1.61.0",
]

[project.scripts]
journey-portal = "journey_portal.cli.main:main"

[project.urls]
Homepage = "https://github.com/portable-genai/journey-portal"
Source = "https://github.com/portable-genai/journey-portal"

# Required for the commons git+https pins (direct references).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/journey_portal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"eval/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# google-auth is lazy-imported only in the gcp identity adapter and is absent from the SDK-free
# gate, so there are no stubs to resolve; treat it (and PyYAML, if the stub is absent) as untyped
# rather than failing.
[[tool.mypy.overrides]]
module = ["google.*", "yaml"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that need live upstream apps / cloud services (deselected by default)",
]
